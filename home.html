<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/home.css">
</head>

<body>

    <div id="app">
        <h1>Minhas tarefas</h1>

        <button id="btn-nova-tarefa">+ Nova tarefa</button>

        <p id="mensagem-vazia">Sua lista está vazia. Adicione a primeira tarefa!</p>

        <ul id="lista-tarefas"></ul>

        <div class="modal fade" id="modal-nova-tarefa" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nova tarefa</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <label for="input-nova-tarefa">Nome da tarefa</label>
                        <input type="text" id="input-nova-tarefa" class="form-control">
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="btn-salvar-tarefa">Salvar</button>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script src="js/lib/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
